name: publish

# 推送 main 时自动发布「版本有更新」的包（对比 npm registry 已发布版本，bump 过的才发）。
# 也支持 git tag v* 触发，同样走版本对比，已发布的包自动跳过。
#
# 认证：npm Trusted Publishing (OIDC)，无需 NPM_TOKEN，自动满足 2FA。
# 前置条件（npmjs.com 一次性配置，2026-08 已验证生效）：
#   包 Settings → Trusted Publisher → GitHub：owner=maybe-kefka, repo=pi-extensions, workflow=publish.yml
#   workflow 字段只填文件名（publish.yml），权限勾选 npm publish

on:
  push:
    branches: [main]
    tags: ["v*"]

# 并发保护：push main 与 push tag 同时触发时（发版场景常见），
# 两个 run 会同时读到旧版本号并重复发布——串行化为同一组，
# 后到的 run 排队等待，跑到时 registry 已是新版本 → 脚本自动 skip。
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  id-token: write # OIDC：npm registry 据此签发一次性发布凭据
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 才支持 OIDC 认证
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci

      - name: Quality gates
        run: |
          npm test
          npm run typecheck

      - name: Publish changed packages
        run: bash .github/scripts/publish-changed.sh
