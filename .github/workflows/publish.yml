name: publish

# 推送 main 时自动发布「版本有更新」的包（对比 npm registry 已发布版本，bump 过的才发）。
# 也支持 git tag v* 触发，同样走版本对比，已发布的包自动跳过。
#
# 认证：npm Trusted Publishing (OIDC)，无需 NPM_TOKEN，自动满足 2FA 与 provenance。
# 前置条件（npmjs.com 一次性配置）：
#   npmjs.com → Account → Trusted Publishing → Add
#   OIDC 主体：owner=maybe-kefka, repo=pi-extensions, workflow=publish.yml

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write # OIDC：npm registry 据此签发一次性发布凭据
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24 # npm >= 11.5.1 才支持 OIDC 认证
          registry-url: https://registry.npmjs.org/
          cache: npm

      - run: npm ci

      - name: Quality gates
        run: |
          npm test
          npm run typecheck

      - name: Debug OIDC claims
        run: |
          set +e
          TOKEN=$(curl -s -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" | node -p "JSON.parse(require('fs').readFileSync(0)).value" 2>/dev/null)
          if [ -z "$TOKEN" ]; then
            echo "::error::OIDC token fetch failed (curl or parse error)"
            exit 0
          fi
          echo "::error::GitHub OIDC claims (npm audience):"
          echo "$TOKEN" | node -e "
            const t = require('fs').readFileSync(0, 'utf8').trim();
            const p = JSON.parse(Buffer.from(t.split('.')[1], 'base64url').toString());
            const out = JSON.stringify({ aud: p.aud, repository: p.repository, workflow: p.workflow, ref: p.ref, sub: p.sub }, null, 1);
            for (const line of out.split('\n')) console.log(line);
          " 2>/dev/null | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0

      - name: Publish changed packages
        run: |
          set +e
          bash .github/scripts/publish-changed.sh 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            echo "::error::npm publish FAILED (exit $status). Key error lines:"
            grep -iE "npm error|npm notice publish|ERR[! ]|E4[0-9]{2}|ENEED|EOTP|trusted|oidc|forbidden|unauthorized|401|403" /tmp/publish.log | tail -25 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done
            echo "::error::End of failed publish log"
            exit 0 # 诊断模式：失败但保持绿，错误在上方 annotation
          fi
